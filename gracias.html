<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitud enviada | Comercial Cimma</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b0b0b;
            color: #f5f5f5;
        }
        .thanks-container {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 2rem;
            text-align: center;
        }
        .thanks-card {
            max-width: 640px;
            background: #151515;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        .thanks-card h1 {
            margin-bottom: 1rem;
            color: #f2c94c;
        }
        .thanks-card p {
            line-height: 1.6;
            color: #d3d3d3;
        }
        .btn-main {
            display: inline-block;
            margin-top: 1.3rem;
            background: #f2c94c;
            color: #111;
            padding: 12px 24px;
            border-radius: 999px;
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="thanks-container">
        <div class="thanks-card">
            <h1>¡Gracias por contactarnos!</h1>
            <p>Tu solicitud fue enviada correctamente. Pronto nos pondremos en contacto contigo para responder tu consulta.</p>
            <a href="index.html" class="btn-main">Volver al inicio</a>
        </div>
    </div>
</body>
</html>
